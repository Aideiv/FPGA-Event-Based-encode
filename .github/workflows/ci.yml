# CI/CD Pipeline — FPGA Event-Based Drone Collision Avoidance
#
# Triggers on every push and pull request.
# Tests: Python pipeline, ARM C++ unit tests, FPGA testbench, linting.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Python Pipeline Tests
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python Pipeline Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run Python pipeline simulator tests
        run: |
          python test/test_fpga_simulator.py
      - name: Run FPGA equivalence check
        run: |
          python test/golden_model_test.py
      - name: Run FPGA weight conversion test
        run: |
          python train/convert_weights_to_fpga.py --validate-only
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 drone/ models/ train/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # ---------------------------------------------------------------------------
  # ARM C++ Unit Tests
  # ---------------------------------------------------------------------------
  arm-cpp-tests:
    name: ARM C++ Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Build ARM C++ tests
        run: |
          cd arm
          make sim
      - name: Run ARM C++ collision predictor tests
        run: |
          g++ -std=c++17 -I. -I./arm -o test_arm_cp test/test_arm_collision_predictor.cpp -lpthread
          ./test_arm_cp
      - name: Build and run ARM evasion controller tests (if file exists)
        run: |
          if [ -f test/test_arm_evasion_controller.cpp ]; then
            cd test
            g++ -std=c++17 -I.. -I../arm -o test_arm_evasion test_arm_evasion_controller.cpp -lpthread
            ./test_arm_evasion
          else
            echo "test_arm_evasion_controller.cpp not found — skipping (add when ready)"
          fi

  # ---------------------------------------------------------------------------
  # FPGA Testbench (C++ simulation, no HLS toolchain needed)
  # ---------------------------------------------------------------------------
  fpga-testbench:
    name: FPGA C++ Testbench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Compile FPGA testbench
        run: |
          cd fpga
          g++ -std=c++11 -I. -D__SIMULATION__ -o testbench testbench.cpp -lm
      - name: Run FPGA testbench
        run: |
          cd fpga
          ./testbench
      - name: Run FPGA equivalence predictor
        run: |
          python test/golden_model_test.py

  # ---------------------------------------------------------------------------
  # Build Check (verifies all Makefiles and setup.py work)
  # ---------------------------------------------------------------------------
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - name: Check setup.py builds
        run: |
          pip install --upgrade pip setuptools wheel
          python setup.py sdist
      - name: Check ARM Makefile compiles
        run: |
          cd arm
          make sim
      - name: Check root Makefile targets
        run: |
          make help