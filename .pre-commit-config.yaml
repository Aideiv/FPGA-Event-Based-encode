# Setup: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++]
        files: ^(arm|fpga|test)/
        exclude: ^fpga/weights/  # auto-generated by convert_weights_to_fpga.py
